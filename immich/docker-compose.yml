# ============================================================
# Immich: self-hosted photo management
# Sanitized copy of the home server deployment.
#
# Storage layout:
#   HDD (/mnt/wd2tb): original photos and videos
#   SSD: thumbnails, encoded video, profile images, and the
#        Postgres database, which are read most often
# ============================================================

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.3}
    volumes:
      # HDD: original photos and videos
      - /mnt/wd2tb/immich/pics:/usr/src/app/upload/library
      # SSD: generated files that Immich reads often
      - ./upload/thumbs:/usr/src/app/upload/thumbs
      - ./upload/encoded-video:/usr/src/app/upload/encoded-video
      - ./upload/profile:/usr/src/app/upload/profile
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Listen only on the server's Tailscale address, so Immich is not
      # reachable from the LAN or the internet. Docker needs tailscaled
      # to be up before this container starts.
      - ${TAILSCALE_IP:?set TAILSCALE_IP in .env}:2283:2283
    environment:
      DB_HOSTNAME: postgres
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE}
      REDIS_HOSTNAME: redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video] # GTX 1050 Ti NVENC for video transcoding
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.3}-cuda
    volumes:
      - model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute] # GTX 1050 Ti CUDA for face recognition and smart search
    restart: always

  postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine
    restart: always

volumes:
  model-cache:
