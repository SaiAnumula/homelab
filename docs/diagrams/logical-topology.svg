<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Homelab Logical Topology">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 15px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .zone { fill: #ffffff; stroke: #000000; stroke-width: 1.1; }
      .zone-ext { fill: #ffffff; stroke: #000000; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .ts-box { fill: #ffffff; stroke: #000000; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #000000; stroke-width: 1.1; }
      .z-lbl { font: 700 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .b-title { font: 700 12px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .b-txt { font: 400 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #222222; }
      .b-ctr { font: 700 12px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; text-anchor: middle; }
      .b-ctr-sub { font: 400 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #222222; text-anchor: middle; }
      .lbl { font: 400 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .solid { stroke: #000000; stroke-width: 1.3; fill: none; }
      .dashed { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; }
      .dotted { stroke: #000000; stroke-width: 1.4; stroke-dasharray: 2 3; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="420"/>
  <text class="title" x="24" y="30">Logical Topology</text>

  <!-- Left: Remote Peers -->
  <rect class="zone-ext" x="24" y="52" width="212" height="240"/>
  <text class="z-lbl" x="36" y="72">Remote Peers</text>

  <rect class="box" x="38" y="88" width="184" height="44"/>
  <text class="b-title" x="50" y="107">Admin Devices</text>
  <text class="b-txt" x="50" y="123">HTTPS, SSH, Cockpit</text>

  <rect class="box" x="38" y="156" width="184" height="44"/>
  <text class="b-title" x="50" y="175">Raspberry Pi 5</text>
  <text class="b-txt" x="50" y="191">NAS PoC</text>

  <rect class="box" x="38" y="224" width="184" height="48"/>
  <text class="b-title" x="50" y="244">Desktop &amp; Laptop</text>
  <text class="b-txt" x="50" y="261">Agents, exporters, game svrs</text>

  <!-- Playit box bottom-left -->
  <rect class="box" x="24" y="314" width="212" height="52"/>
  <text class="b-title" x="38" y="336">Playit Tunnel</text>
  <text class="b-txt" x="38" y="353">External players (game port only)</text>
  <line class="dotted" x1="130" y1="314" x2="130" y2="276" marker-end="url(#arr)"/>

  <!-- Center: Tailscale Overlay -->
  <rect class="ts-box" x="286" y="146" width="176" height="92"/>
  <text class="b-ctr" x="374" y="176">Tailscale Overlay</text>
  <text class="b-ctr-sub" x="374" y="198">Peer-to-peer WireGuard</text>
  <text class="b-ctr-sub" x="374" y="216">(no subnet router)</text>

  <!-- Connections: Remote Peers <-> Tailscale -->
  <line class="solid" x1="222" y1="110" x2="282" y2="164" marker-end="url(#arr)"/>
  <line class="solid" x1="222" y1="178" x2="282" y2="192" marker-end="url(#arr)"/>
  <line class="dashed" x1="222" y1="248" x2="282" y2="220" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Right: Home Server (Home LAN) -->
  <rect class="zone" x="524" y="52" width="312" height="314"/>
  <text class="z-lbl" x="538" y="72">Home Server (Home LAN)</text>

  <!-- UFW Firewall symbol on boundary with opaque white backing so border never crosses text -->
  <g transform="translate(504, 174)">
    <rect fill="#ffffff" stroke="none" x="-2" y="-4" width="44" height="44"/>
    <rect fill="#ffffff" stroke="#000000" stroke-width="1.2" x="4" y="0" width="32" height="20"/>
    <line x1="4" y1="7" x2="36" y2="7" stroke="#000000" stroke-width="1"/>
    <line x1="4" y1="14" x2="36" y2="14" stroke="#000000" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="7" stroke="#000000" stroke-width="1"/>
    <line x1="14" y1="7" x2="14" y2="14" stroke="#000000" stroke-width="1"/>
    <line x1="26" y1="7" x2="26" y2="14" stroke="#000000" stroke-width="1"/>
    <text x="20" y="34" style="font:700 9.5px Helvetica,Arial,sans-serif; fill:#000000; text-anchor:middle;">UFW</text>
  </g>

  <!-- Box 1: Docker Bridges -->
  <rect class="box" x="556" y="88" width="264" height="92"/>
  <text class="b-title" x="568" y="108">Docker Bridge Networks</text>
  <text class="b-txt" x="568" y="128">immich_default, homepage_default,</text>
  <text class="b-txt" x="568" y="144">wallos_wallos_internal (loopback -&gt; Serve)</text>
  <text class="b-txt" x="568" y="164">monitoring_mon (tailscale0 bind only)</text>

  <!-- Box 2: Docker Host Network -->
  <rect class="box" x="556" y="196" width="264" height="72"/>
  <text class="b-title" x="568" y="216">Docker Host Network</text>
  <text class="b-txt" x="568" y="236">Plex (:32400 -&gt; tailscale0), Jellyfin</text>
  <text class="b-txt" x="568" y="252">node-exporter, cAdvisor, Alloy, blackbox</text>

  <!-- Box 3: Host Services -->
  <rect class="box" x="556" y="280" width="264" height="76"/>
  <text class="b-title" x="568" y="299">Host Services (systemd)</text>
  <text class="b-txt" x="568" y="317">Tailscale Serve (HTTPS -&gt; 127.0.0.1)</text>
  <text class="b-txt" x="568" y="333">Cockpit (loopback), SSH</text>
  <text class="b-txt" x="568" y="349">Mission Control dashboard &amp; agent</text>

  <!-- Connections: Tailscale <-> Home Server -->
  <path class="solid" d="M 462 166 L 490 166 L 490 134 L 552 134" marker-end="url(#arr)"/>
  <path class="solid" d="M 462 184 L 508 184"/>
  <path class="solid" d="M 540 184 L 548 184 L 548 232 L 552 232" marker-end="url(#arr)"/>
  <path class="dashed" d="M 462 216 L 490 216 L 490 318 L 552 318" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Legend -->
  <line class="solid" x1="24" y1="396" x2="56" y2="396"/>
  <text class="lbl" x="64" y="400">Tailscale access (Serve HTTPS / tailscale0)</text>

  <line class="dashed" x1="336" y1="396" x2="368" y2="396"/>
  <text class="lbl" x="376" y="400">Cross-site polling / metrics</text>

  <line class="dotted" x1="560" y1="396" x2="592" y2="396"/>
  <text class="lbl" x="600" y="400">Playit game port</text>
</svg>
