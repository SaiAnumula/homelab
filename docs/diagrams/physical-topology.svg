<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Homelab Physical Topology">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 15px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .zone { fill: #ffffff; stroke: #000000; stroke-width: 1; stroke-dasharray: 5 4; }
      .zone-lbl { font: 700 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .dev { font: 700 12px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; text-anchor: middle; }
      .sub { font: 400 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #333333; text-anchor: middle; }
      .lbl { font: 400 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .lbl-b { font: 700 10.5px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #000000; }
      .solid { stroke: #000000; stroke-width: 1.3; fill: none; }
      .dashed { stroke: #000000; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; }
      .dotted { stroke: #000000; stroke-width: 1.4; stroke-dasharray: 2 3; fill: none; }
      .sym { fill: #ffffff; stroke: #000000; stroke-width: 1.3; stroke-linejoin: miter; stroke-linecap: square; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <rect class="bg" width="860" height="400"/>
  <text class="title" x="24" y="30">Physical Topology</text>

  <!-- Internet Cloud -->
  <g transform="translate(358, 42)">
    <path class="sym" d="M20,38 H100 C109,38 115,32 115,24 C115,17 110,12 103,11 C100,3 91,-1 82,1 C75,-4 62,-3 57,4 C48,2 38,7 36,16 C28,17 23,23 23,29 C23,35 12,38 20,38 Z"/>
    <text class="dev" x="68" y="24">Internet</text>
  </g>

  <!-- Left: Home LAN -->
  <rect class="zone" x="24" y="114" width="228" height="232"/>
  <text class="zone-lbl" x="36" y="134">Home LAN</text>

  <!-- WAN line -->
  <path class="solid" d="M 380 68 L 138 68 L 138 156"/>
  <text class="lbl" x="240" y="62">WAN</text>

  <!-- Router -->
  <g transform="translate(102, 158)">
    <path class="sym" d="M0,12 L0,30 A36,11 0 0,0 72,30 L72,12 Z"/>
    <ellipse class="sym" cx="36" cy="12" rx="36" ry="11"/>
    <line x1="22" y1="8" x2="50" y2="16" stroke="#000000" stroke-width="1.2"/>
    <line x1="50" y1="8" x2="22" y2="16" stroke="#000000" stroke-width="1.2"/>
    <text class="dev" x="36" y="54">Router</text>
  </g>

  <!-- Ethernet 1 GbE line -->
  <line class="solid" x1="138" y1="218" x2="138" y2="250"/>
  <text class="lbl" x="146" y="238">1 GbE</text>

  <!-- Home Server -->
  <g transform="translate(114, 252)">
    <rect class="sym" x="6" y="0" width="36" height="54"/>
    <line x1="12" y1="10" x2="36" y2="10" stroke="#000000" stroke-width="1.2"/>
    <line x1="12" y1="18" x2="36" y2="18" stroke="#000000" stroke-width="1.2"/>
    <circle cx="34" cy="44" r="2" fill="#000000"/>
    <text class="dev" x="24" y="72">Home Server</text>
    <text class="sub" x="24" y="85">Ubuntu</text>
  </g>

  <!-- Right: Remote Network (externally managed) -->
  <rect class="zone" x="320" y="114" width="516" height="232"/>
  <text class="zone-lbl" x="334" y="134">Remote Network (externally managed)</text>

  <!-- External uplink -->
  <path class="solid" d="M 473 68 L 578 68 L 578 114"/>

  <!-- Tailscale Overlay line (dashed) -->
  <path class="dashed" d="M 164 280 L 286 280 L 286 174 L 774 174"/>
  <line class="dashed" x1="392" y1="174" x2="392" y2="246" marker-end="url(#arr)"/>
  <line class="dashed" x1="520" y1="174" x2="520" y2="246" marker-end="url(#arr)"/>
  <line class="dashed" x1="648" y1="174" x2="648" y2="246" marker-end="url(#arr)"/>
  <line class="dashed" x1="774" y1="174" x2="774" y2="246" marker-end="url(#arr)"/>
  <line class="dashed" x1="164" y1="280" x2="176" y2="280" marker-start="url(#arr)"/>
  <text class="lbl-b" x="562" y="166">Tailscale (WireGuard overlay)</text>

  <!-- Playit Tunnel (dotted) -->
  <path class="dotted" d="M 473 80 L 664 80 L 664 148 L 540 148 L 540 246" marker-end="url(#arr)"/>
  <path class="dotted" d="M 540 148 L 412 148 L 412 246" marker-end="url(#arr)"/>
  <text class="lbl" x="674" y="84">Playit (game port only)</text>

  <!-- Desktop -->
  <g transform="translate(362, 252)">
    <rect class="sym" x="2" y="4" width="40" height="28"/>
    <rect fill="#ffffff" stroke="#000000" stroke-width="1" x="6" y="8" width="32" height="20"/>
    <line x1="22" y1="32" x2="22" y2="40" stroke="#000000" stroke-width="1.4"/>
    <line x1="14" y1="40" x2="30" y2="40" stroke="#000000" stroke-width="1.4"/>
    <rect class="sym" x="46" y="8" width="16" height="40"/>
    <text class="dev" x="32" y="72">Desktop</text>
    <text class="sub" x="32" y="85">Ethernet</text>
  </g>

  <!-- Laptop -->
  <g transform="translate(490, 252)">
    <rect class="sym" x="8" y="10" width="46" height="30"/>
    <rect fill="#ffffff" stroke="#000000" stroke-width="1" x="12" y="14" width="38" height="22"/>
    <polygon class="sym" points="0,45 62,45 56,40 6,40"/>
    <text class="dev" x="31" y="72">Laptop</text>
    <text class="sub" x="31" y="85">Wi-Fi</text>
  </g>

  <!-- Pi 5 -->
  <g transform="translate(618, 252)">
    <rect class="sym" x="8" y="10" width="44" height="34"/>
    <rect fill="#ffffff" stroke="#000000" stroke-width="1" x="20" y="18" width="20" height="16"/>
    <text class="dev" x="30" y="72">Pi 5</text>
    <text class="sub" x="30" y="85">NAS PoC</text>
  </g>

  <!-- Admin Devices -->
  <g transform="translate(744, 256)">
    <rect class="sym" x="4" y="6" width="30" height="20"/>
    <polygon class="sym" points="0,30 38,30 34,26 4,26"/>
    <rect class="sym" x="44" y="10" width="14" height="22"/>
    <text class="dev" x="30" y="68">Admin Devices</text>
    <text class="sub" x="30" y="81">Laptop / Phone</text>
  </g>

  <!-- Legend -->
  <line class="solid" x1="24" y1="376" x2="56" y2="376"/>
  <text class="lbl" x="64" y="380">Physical link</text>

  <line class="dashed" x1="168" y1="376" x2="200" y2="376"/>
  <text class="lbl" x="208" y="380">Tailscale overlay</text>

  <line class="dotted" x1="336" y1="376" x2="368" y2="376"/>
  <text class="lbl" x="376" y="380">Playit game tunnel</text>
</svg>
