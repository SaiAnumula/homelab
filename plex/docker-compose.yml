# ============================================================
# Plex: media streaming
# Sanitized copy of the home server deployment.
#
# Notes:
#   - Host networking lets Plex use local discovery (GDM).
#   - The GTX 1050 Ti handles transcoding through NVENC and
#     NVDEC, so the CPU does not have to.
#   - Config, metadata, and transcodes live on the SSD. The
#     movie and anime libraries live on the 2 TB HDD.
# ============================================================

name: plex-media-server

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
      # One-time claim token from plex.tv/claim, needed only on
      # the first run. It lives in .env, which Git ignores.
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      # SSD: Plex database, artwork cache, and metadata
      - ./config:/config
      - ./transcode:/transcode
      # HDD: media library on the 2 TB drive
      - /mnt/wd2tb/plex/movies:/movies
      - /mnt/wd2tb/plex/anime:/anime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video] # GTX 1050 Ti NVENC and NVDEC
    restart: always
